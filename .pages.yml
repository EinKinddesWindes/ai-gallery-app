 media:
  input: public/uploads
  output: /ai-gallery-app/uploads

 content:
  - name: projekte
    label: Projekte
    type: collection
    path: content/projekte
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Kurzbeschreibung
        type: text
      - name: image
        label: Titelbild
        type: image
      - name: body
        label: Inhalt
        type: rich-text

  - name: forschung
    label: Forschung
    type: collection
    path: content/forschung
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Kurzbeschreibung
        type: text
      - name: image
        label: Titelbild
        type: image
      - name: body
        label: Inhalt
        type: rich-text

  - name: aktuelles
    label: Aktuelles
    type: collection
    path: content/aktuelles
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Kurzbeschreibung
        type: text
      - name: image
        label: Titelbild
        type: image
      - name: body
        label: Inhalt
        type: rich-text
